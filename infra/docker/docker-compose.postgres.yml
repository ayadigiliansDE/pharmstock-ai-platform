services:
  postgres:
    image: postgres:18.6
    hostname: pharmstock-postgres
    container_name: pharmstock-postgres
    ports:
      - "${PHARMSTOCK_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "pharmstock_ops"
      POSTGRES_USER: "pharmstock_admin"
      POSTGRES_PASSWORD: "${PHARMSTOCK_POSTGRES_PASSWORD:?PHARMSTOCK_POSTGRES_PASSWORD must be set}"
      PHARMSTOCK_APP_PASSWORD: "${PHARMSTOCK_APP_PASSWORD:?PHARMSTOCK_APP_PASSWORD must be set}"
      PHARMSTOCK_CDC_PASSWORD: "${PHARMSTOCK_CDC_PASSWORD:?PHARMSTOCK_CDC_PASSWORD must be set}"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=512MB
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=200
    volumes:
      - pharmstock-postgres-data:/var/lib/postgresql/data
      - ../../:/opt/pharmstock:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pharmstock-postgres-data:
