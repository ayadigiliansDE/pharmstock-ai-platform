[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmstock-ai-platform"
version = "0.34.2"
description = "Production-style pharmacy stock, analytics, ML and AI data platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.13.4",
    "tzdata==2026.3",
    "confluent-kafka==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]
gcp = [
    "google-cloud-bigquery==3.43.0",
]
analytics = [
    "dbt-core==1.12.2",
    "dbt-bigquery==1.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.per-file-target-version]
"spark/jobs/*.py" = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP010"]
